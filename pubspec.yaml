name: studydeck_ai
description: "StudyDeckAI - Nền tảng học tập thông minh 3 Target (Mobile, Web User, Web Admin)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^14.0.0
  get_it: ^7.7.0
  dio: ^5.5.0
  shared_preferences: ^2.2.3
  flutter_riverpod: ^2.5.1
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/audio/
