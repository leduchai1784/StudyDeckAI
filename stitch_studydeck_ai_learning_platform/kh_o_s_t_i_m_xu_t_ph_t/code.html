            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);

            transform: translateY(-4px);

<body class="bg-background min-h-screen flex flex-col font-sans text-on-surface">
<!-- Top Navigation for Onboarding (Transactional - No Nav Shell) -->
<header class="w-full px-margin-mobile md:px-margin-desktop py-md flex items-center justify-between">
<div class="flex items-center gap-sm">
<button class="w-10 h-10 rounded-full flex items-center justify-center hover:bg-surface-container-low transition-colors text-on-surface-variant">
<span class="material-symbols-outlined">arrow_back</span>
</button>
</div>
<div class="h-8">
<img alt="StudyDeck AI Logo" class="h-full object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuACGGMycNhBUOSHyAYKA3zSzX7L7bN9aR-jmxyckf9Y5JWqIQzwvLrlIAI0e8q3sP0_xSgkXVDcTZvFI2FS5PoYu6thmUM3dpXkszUKOLgX818JuVn1LHQb-qs9MjDEYVq1hVLVawv1aPVr_A19iE6Kjr2bDtvxCaN0mfY_sSlfrP3v1mxGG5-oD6l_CXgybNuZYUZTYwfqcKSlkTxoUwQJtgCkguMN509-e_XVmOshHE_OWX6CHEatGP1L8gs7CTy8uBI">
</div>
<div class="w-10"></div> <!-- Spacer for centering -->
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center justify-center px-margin-mobile md:px-margin-desktop py-lg max-w-[800px] mx-auto w-full">
<!-- Progress Indicator -->
<div class="w-full max-w-md mb-xl flex flex-col items-center">
<div class="flex justify-between w-full mb-2">
<span class="text-label-sm font-label-sm text-primary uppercase tracking-wider">Bước 4/4</span>
<span class="text-label-sm font-label-sm text-on-surface-variant">Sắp hoàn thành!</span>
</div>
<div class="w-full h-2 bg-surface-container-high rounded-full overflow-hidden">
<div class="h-full bg-primary rounded-full transition-all duration-500 ease-out" style="width: 100%;"></div>
</div>
</div>
<!-- Headline -->
<div class="text-center mb-xl">
<h1 class="text-headline-lg-mobile font-headline-lg-mobile md:text-headline-lg md:font-headline-lg text-on-background mb-sm">Chọn điểm khởi đầu của bạn</h1>
<p class="text-body-lg font-body-lg text-on-surface-variant max-w-lg mx-auto">Chúng tôi sẽ tùy chỉnh lộ trình học dựa trên trình độ hiện tại của bạn.</p>
</div>
<!-- Options Grid -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-gutter w-full">
<!-- Option 1: Start from Zero -->
<button class="bg-surface-container-lowest rounded-xl p-lg text-left deck-shadow hover:deck-shadow-hover transition-all duration-300 border border-transparent hover:border-primary-fixed group relative overflow-hidden flex flex-col min-h-[280px]">
<div class="w-14 h-14 rounded-full bg-surface-container-low flex items-center justify-center mb-md group-hover:scale-110 transition-transform duration-300">
<span class="material-symbols-outlined text-[32px] text-primary">school</span>
</div>
<h2 class="text-title-lg font-title-lg text-on-background mb-sm group-hover:text-primary transition-colors">Bắt đầu từ số 0</h2>
<p class="text-body-md font-body-md text-on-surface-variant flex-grow">Tôi là người mới bắt đầu. Hãy đưa tôi vào bài học vỡ lòng đầu tiên.</p>
<div class="mt-lg flex items-center text-primary font-label-md text-label-md">
<span>Bắt đầu ngay</span>
<span class="material-symbols-outlined ml-xs text-[18px] group-hover:translate-x-1 transition-transform">arrow_forward</span>
</div>
</button>
<!-- Option 2: Level Test (CTA) -->
<button class="bg-surface-container-lowest rounded-xl p-lg text-left deck-shadow hover:deck-shadow-hover transition-all duration-300 border-2 border-amber-400 group relative overflow-hidden flex flex-col min-h-[280px]">
<!-- Sparkle Motif for AI/Smart feature -->
<div class="absolute top-4 right-4 text-amber-500 opacity-50">
<span class="material-symbols-outlined icon-fill">magic_button</span>
</div>
<!-- Badge -->
<div class="absolute top-0 right-0 bg-amber-100 text-amber-600 text-label-sm font-label-sm px-3 py-1 rounded-bl-lg font-bold">
                    Khuyên dùng
                </div>
<div class="w-14 h-14 rounded-full bg-amber-100 flex items-center justify-center mb-md group-hover:scale-110 transition-transform duration-300">
<span class="material-symbols-outlined text-[32px] text-amber-600">psychology</span>
</div>
<h2 class="text-title-lg font-title-lg text-on-background mb-sm group-hover:text-amber-600 transition-colors">Kiểm tra trình độ</h2>
<p class="text-body-md font-body-md text-on-surface-variant flex-grow">Tôi đã có kiến thức nền tảng. Làm bài test nhanh 3 phút để StudyDeck AI xếp lớp phù hợp.</p>
<div class="mt-lg w-full bg-amber-500 text-white rounded-lg py-3 px-4 flex items-center justify-center font-label-md text-label-md group-hover:bg-amber-600 transition-colors shadow-md">
<span>Làm bài kiểm tra (3 phút)</span>
<span class="material-symbols-outlined ml-xs text-[18px]">timer</span>
</div>
</button>
</div>
<div class="mt-xl text-center">
<button class="text-label-md font-label-md text-on-surface-variant hover:text-primary transition-colors underline decoration-transparent hover:decoration-primary underline-offset-4">
                Bỏ qua bước này, tôi sẽ chọn sau
            </button>
</div>
