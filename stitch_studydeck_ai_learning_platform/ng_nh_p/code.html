<body class="bg-surface min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop text-on-surface">
<div class="w-full max-w-md bg-surface-container-lowest rounded-xl p-6 md:p-8 shadow-[0_4px_20px_rgba(0,0,0,0.15)] relative overflow-hidden">
<!-- Header -->
<div class="flex flex-col items-center mb-8">
<img alt="StudyDeck AI Logo" class="h-12 w-auto mb-6 object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAyw5jkkWk_r2ri7wXVHtdUbjfY-_Bev5pasip40g2c6xBfjqUTf1Ik8gTqtnclVC-pOoqzonWqgvnXKy9E4VF_rWqGC0KTgmgGoRP10vcGDP4VpRzPjD9Oh_lAoEvEnWprJiqlL3ztusEG7dfuKa1s63ulZZE9WRb-KUEab4I5WfN_Ftdc1jHJb6TXBFSmLGnYi4rho1sRtNIjyrVZkFltrRwtyvcMdBzoJSDiRQuLsrZb5qyEUV5bBrCBn7-uTHrzMPU">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-surface text-center">Chào mừng quay trở lại</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-2 text-center">Đăng nhập để tiếp tục học tập cùng AI.</p>
</div>
<!-- Form -->
<form action="#" class="space-y-6" method="POST">
<!-- Email/Username -->
<div>
<label class="block font-label-md text-label-md text-[#1E1B4B] mb-2" for="email">Email / Tên đăng nhập</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline-variant">mail</span>
</div>
<input class="block w-full pl-10 pr-3 py-3 border border-[#D1D5DB] rounded-lg bg-surface-container-lowest text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary font-body-md text-body-md transition-colors" id="email" name="email" placeholder="Nhập email hoặc tên đăng nhập" required="" type="email">
</div>
</div>
<!-- Password -->
<div>
<div class="flex items-center justify-between mb-2">
<label class="block font-label-md text-label-md text-[#1E1B4B]" for="password">Mật khẩu</label>
<a class="font-label-sm text-label-sm text-primary hover:text-primary-container transition-colors" href="#">Quên mật khẩu?</a>
</div>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline-variant">lock</span>
</div>
<input class="block w-full pl-10 pr-10 py-3 border border-[#D1D5DB] rounded-lg bg-surface-container-lowest text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary font-body-md text-body-md transition-colors" id="password" name="password" placeholder="Nhập mật khẩu" required="" type="password">
<button class="absolute inset-y-0 right-0 pr-3 flex items-center text-outline-variant hover:text-primary focus:outline-none" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined" id="visibility-icon">visibility_off</span>
</button>
</div>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary-container text-on-primary hover:bg-surface-tint focus:ring-4 focus:outline-none focus:ring-primary-fixed-dim font-label-md text-label-md rounded-lg px-5 py-3.5 text-center flex items-center justify-center gap-2 transition-all duration-200 hover:shadow-[0_8px_20px_rgba(0,0,0,0.25)] hover:-translate-y-1" type="submit">
<span class="">Đăng nhập</span>
<span class="material-symbols-outlined text-[20px]">login</span>
</button>
</form>
<!-- Divider -->
<div class="mt-8 flex items-center justify-between">
<hr class="w-full border-outline-variant">
<span class="p-2 font-label-sm text-label-sm text-outline-variant whitespace-nowrap">Hoặc đăng nhập bằng</span>
<hr class="w-full border-outline-variant">
</div>
<!-- Social Login -->
<div class="mt-6 grid grid-cols-2 gap-4">
<button class="flex items-center justify-center gap-2 px-4 py-2.5 border border-[#D1D5DB] rounded-lg bg-surface-container-lowest text-on-surface hover:bg-surface-container-low focus:ring-2 focus:ring-outline-variant transition-colors" type="button">

<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
<span class="font-label-md text-label-md">Google</span>
</button>
<button class="flex items-center justify-center gap-2 px-4 py-2.5 border border-[#D1D5DB] rounded-lg bg-surface-container-lowest text-on-surface hover:bg-surface-container-low focus:ring-2 focus:ring-outline-variant transition-colors" type="button">
<svg aria-hidden="true" class="w-5 h-5 text-[#1877F2]" fill="currentColor" viewBox="0 0 24 24">
<path clip-rule="evenodd" d="M22 12c0-5.523-4.477-10-10-10S2 6.477 2 12c0 4.991 3.657 9.128 8.438 9.878v-6.987h-2.54V12h2.54V9.797c0-2.506 1.492-3.89 3.777-3.89 1.094 0 2.238.195 2.238.195v2.46h-1.26c-1.243 0-1.63.771-1.63 1.562V12h2.773l-.443 2.89h-2.33v6.988C18.343 21.128 22 16.991 22 12z" fill-rule="evenodd"></path>
</svg>
<span class="font-label-md text-label-md">Facebook</span>
</button>
</div>
<!-- Sign Up Link -->
<p class="mt-8 text-center font-body-md text-body-md text-on-surface-variant">
            Chưa có tài khoản? <a class="font-label-md text-label-md text-primary hover:text-primary-container transition-colors" href="#">Đăng ký ngay</a>
</p>
</div>
<script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const visibilityIcon = document.getElementById('visibility-icon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                visibilityIcon.textContent = 'visibility';
            } else {
                passwordInput.type = 'password';
                visibilityIcon.textContent = 'visibility_off';
            }
        }
    </script>
