<!DOCTYPE html><html lang="vi"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>StudyDeck - Onboarding</title>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<!-- Google Fonts: Be Vietnam Pro -->
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Theme Configuration -->
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "tertiary-fixed-dim": "#ffb95f",
                    "surface-variant": "#e3dfff",
                    "primary": "#3525cd",
                    "primary-fixed": "#e2dfff",
                    "surface-dim": "#dad6ff",
                    "tertiary-container": "#885500",
                    "inverse-primary": "#c3c0ff",
                    "surface-container-high": "#e9e5ff",
                    "on-surface-variant": "#464555",
                    "surface-tint": "#4d44e3",
                    "on-background": "#181445",
                    "secondary-fixed-dim": "#bac5f0",
                    "on-secondary-fixed-variant": "#3a456a",
                    "secondary-fixed": "#dbe1ff",
                    "inverse-surface": "#2d2a5b",
                    "on-secondary": "#ffffff",
                    "inverse-on-surface": "#f3eeff",
                    "error": "#ba1a1a",
                    "surface": "#fcf8ff",
                    "tertiary-fixed": "#ffddb8",
                    "on-primary-fixed": "#0f0069",
                    "on-tertiary-container": "#ffd4a4",
                    "on-secondary-fixed": "#0d1a3c",
                    "error-container": "#ffdad6",
                    "surface-container-lowest": "#ffffff",
                    "on-secondary-container": "#4f5a80",
                    "outline-variant": "#c7c4d8",
                    "on-primary-fixed-variant": "#3323cc",
                    "surface-bright": "#fcf8ff",
                    "on-error-container": "#93000a",
                    "on-tertiary-fixed": "#2a1700",
                    "secondary": "#525d83",
                    "on-tertiary": "#ffffff",
                    "primary-fixed-dim": "#c3c0ff",
                    "tertiary": "#684000",
                    "surface-container": "#efebff",
                    "outline": "#777587",
                    "surface-container-highest": "#e3dfff",
                    "on-tertiary-fixed-variant": "#653e00",
                    "secondary-container": "#c8d3ff",
                    "background": "#fcf8ff",
                    "on-surface": "#181445",
                    "on-error": "#ffffff",
                    "primary-container": "#4f46e5",
                    "on-primary": "#ffffff",
                    "surface-container-low": "#f6f2ff",
                    "on-primary-container": "#dad7ff"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "margin-desktop": "40px",
                    "md": "24px",
                    "sm": "12px",
                    "xl": "80px",
                    "lg": "48px",
                    "base": "8px",
                    "gutter": "24px",
                    "xs": "4px",
                    "margin-mobile": "16px"
            },
            "fontFamily": {
                    "headline-md": ["Be Vietnam Pro"],
                    "label-sm": ["Be Vietnam Pro"],
                    "display-lg": ["Be Vietnam Pro"],
                    "body-md": ["Be Vietnam Pro"],
                    "label-md": ["Be Vietnam Pro"],
                    "headline-lg": ["Be Vietnam Pro"],
                    "body-lg": ["Be Vietnam Pro"],
                    "headline-lg-mobile": ["Be Vietnam Pro"],
                    "title-lg": ["Be Vietnam Pro"]
            },
            "fontSize": {
                    "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "700"}],
                    "label-sm": ["12px", {"lineHeight": "16px", "fontWeight": "600"}],
                    "display-lg": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "label-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600"}],
                    "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "700"}],
                    "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                    "headline-lg-mobile": ["28px", {"lineHeight": "36px", "fontWeight": "700"}],
                    "title-lg": ["20px", {"lineHeight": "28px", "fontWeight": "600"}]
            }
          }
        }
      }
    </script>
<style>
        /* Custom utilities for the deck metaphor shadows */
        .deck-shadow {
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }
        .deck-shadow-active {
            box-shadow: 0 8px 24px rgba(53, 37, 205, 0.15);
        }
    </style>
</head>
<body class="bg-surface font-sans text-on-surface min-h-screen flex flex-col selection:bg-primary-container selection:text-on-primary-container">
<!-- Top Navigation Area (Minimal for Onboarding) -->
<header class="w-full flex items-center justify-between px-margin-mobile py-6 z-10 relative">
<button class="w-10 h-10 flex items-center justify-center rounded-full text-on-surface-variant hover:bg-surface-container-high transition-colors" type="button">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<div class="flex-1 flex justify-center">
<img alt="StudyDeck AI Logo" class="h-8 object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAU3_-bYT_I1U3LHSfgLmSWeSVaWYxMJeToINtPV5xOBGFuTVGVClM2YgBiojF6jAjbm8Lnu2mtmXAGeHY9nSKi_N7MYga5LZoFQjVpWU2g3EWz_Krk8BqlkPpRGZGaMD_1gBf59i0Ufld7WSYK6w4Fg5VgP6cRQn1cXkdodYOtsoGZG3WL9mFju1WBZGEbYPptPjg0FsziJOKGCCdr1nRU9WMkSQDZDeYx9jBi4r7chG40oE0fjY7KiAXsEqaKityqD5A">
</div>
<!-- Empty div for flex balance -->
<div class="w-10 h-10"></div>
</header>
<!-- Progress Indicator -->
<div class="px-margin-mobile mb-8">
<div class="flex justify-between items-end mb-2">
<span class="text-label-sm font-label-sm text-primary uppercase tracking-wider">Lộ trình học tập</span>
<span class="text-label-sm font-label-sm text-on-surface-variant">Bước 3/4</span>
</div>
<div class="h-2 w-full bg-surface-container-high rounded-full overflow-hidden">
<!-- 75% width for Step 3/4 -->
<div class="h-full bg-primary rounded-full w-[75%] transition-all duration-1000 ease-out relative">
<!-- Sparkle effect indicator on the tip of the progress bar -->
<div class="absolute right-0 top-1/2 -translate-y-1/2 w-4 h-4 bg-white/30 blur-[2px] rounded-full"></div>
</div>
</div>
</div>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col px-margin-mobile pb-32">
<div class="max-w-md mx-auto w-full">
<h1 class="text-headline-lg-mobile font-headline-lg-mobile text-on-surface mb-8 text-center balance-text">
                Mỗi ngày bạn muốn dành bao nhiêu thời gian?
            </h1>
<!-- Options Grid/List -->
<form class="flex flex-col gap-sm" id="time-selection-form">
<!-- Option 1: 5 mins -->
<label class="relative block cursor-pointer group">
<input class="peer sr-only" name="study_time" required="" type="radio" value="5">
<!-- Card Background & Border -->
<div class="absolute inset-0 rounded-2xl bg-surface-container-lowest border-2 border-outline-variant deck-shadow transition-all duration-300 peer-checked:border-primary peer-checked:bg-primary/5 peer-checked:deck-shadow-active group-hover:-translate-y-[2px]"></div>
<!-- Card Content -->
<div class="relative p-4 md:p-5 flex items-center transition-transform duration-300 group-hover:-translate-y-[2px]">
<!-- Icon Box -->
<div class="w-14 h-14 rounded-xl bg-surface-container-high flex flex-col items-center justify-center text-on-surface-variant transition-colors duration-300 peer-checked:bg-primary peer-checked:text-on-primary shadow-sm z-10 shrink-0">
<span class="material-symbols-outlined text-[28px]" style="font-variation-settings: 'FILL' 1;">hourglass_empty</span>
</div>
<!-- Text Content -->
<div class="ml-4 flex-1 z-10">
<div class="text-title-lg font-title-lg text-on-surface mb-0.5 transition-colors peer-checked:text-primary">5 phút/ngày</div>
<div class="text-label-md font-label-md text-on-surface-variant">Nhẹ nhàng</div>
</div>
<!-- Radio Indicator -->
<div class="w-6 h-6 rounded-full border-2 border-outline-variant flex items-center justify-center transition-all duration-300 z-10 peer-checked:border-primary peer-checked:bg-primary ml-2 shrink-0">
<span class="material-symbols-outlined text-[14px] text-on-primary scale-0 transition-transform duration-300 peer-checked:scale-100 font-bold">check</span>
</div>
</div>
</label>
<!-- Option 2: 10 mins -->
<label class="relative block cursor-pointer group">
<input class="peer sr-only" name="study_time" type="radio" value="10">
<div class="absolute inset-0 rounded-2xl bg-surface-container-lowest border-2 border-outline-variant deck-shadow transition-all duration-300 peer-checked:border-primary peer-checked:bg-primary/5 peer-checked:deck-shadow-active group-hover:-translate-y-[2px]"></div>
<div class="relative p-4 md:p-5 flex items-center transition-transform duration-300 group-hover:-translate-y-[2px]">
<div class="w-14 h-14 rounded-xl bg-surface-container-high flex flex-col items-center justify-center text-on-surface-variant transition-colors duration-300 peer-checked:bg-primary peer-checked:text-on-primary shadow-sm z-10 shrink-0">
<span class="material-symbols-outlined text-[28px]" style="font-variation-settings: 'FILL' 1;">schedule</span>
</div>
<div class="ml-4 flex-1 z-10">
<div class="text-title-lg font-title-lg text-on-surface mb-0.5 transition-colors peer-checked:text-primary">10 phút/ngày</div>
<div class="text-label-md font-label-md text-on-surface-variant">Vừa sức</div>
</div>
<div class="w-6 h-6 rounded-full border-2 border-outline-variant flex items-center justify-center transition-all duration-300 z-10 peer-checked:border-primary peer-checked:bg-primary ml-2 shrink-0">
<span class="material-symbols-outlined text-[14px] text-on-primary scale-0 transition-transform duration-300 peer-checked:scale-100 font-bold">check</span>
</div>
</div>
</label>
<!-- Option 3: 15 mins -->
<label class="relative block cursor-pointer group">
<input checked="" class="peer sr-only" name="study_time" type="radio" value="15"> <!-- Default selection for visual demo -->
<div class="absolute inset-0 rounded-2xl bg-surface-container-lowest border-2 border-outline-variant deck-shadow transition-all duration-300 peer-checked:border-primary peer-checked:bg-primary/5 peer-checked:deck-shadow-active group-hover:-translate-y-[2px]"></div>
<div class="relative p-4 md:p-5 flex items-center transition-transform duration-300 group-hover:-translate-y-[2px]">
<div class="w-14 h-14 rounded-xl bg-surface-container-high flex flex-col items-center justify-center text-on-surface-variant transition-colors duration-300 peer-checked:bg-primary peer-checked:text-on-primary shadow-sm z-10 shrink-0">
<span class="material-symbols-outlined text-[28px]" style="font-variation-settings: 'FILL' 1;">timer</span>
</div>
<div class="ml-4 flex-1 z-10">
<div class="text-title-lg font-title-lg text-on-surface mb-0.5 transition-colors peer-checked:text-primary">15 phút/ngày</div>
<div class="text-label-md font-label-md text-on-surface-variant">Nghiêm túc</div>
</div>
<div class="w-6 h-6 rounded-full border-2 border-outline-variant flex items-center justify-center transition-all duration-300 z-10 peer-checked:border-primary peer-checked:bg-primary ml-2 shrink-0">
<span class="material-symbols-outlined text-[14px] text-on-primary scale-0 transition-transform duration-300 peer-checked:scale-100 font-bold">check</span>
</div>
</div>
</label>
<!-- Option 4: 30 mins -->
<label class="relative block cursor-pointer group">
<input class="peer sr-only" name="study_time" type="radio" value="30">
<div class="absolute inset-0 rounded-2xl bg-surface-container-lowest border-2 border-outline-variant deck-shadow transition-all duration-300 peer-checked:border-primary peer-checked:bg-primary/5 peer-checked:deck-shadow-active group-hover:-translate-y-[2px]"></div>
<div class="relative p-4 md:p-5 flex items-center transition-transform duration-300 group-hover:-translate-y-[2px]">
<div class="w-14 h-14 rounded-xl bg-surface-container-high flex flex-col items-center justify-center text-on-surface-variant transition-colors duration-300 peer-checked:bg-primary peer-checked:text-on-primary shadow-sm z-10 shrink-0 relative overflow-hidden">
<span class="material-symbols-outlined text-[28px] relative z-10" style="font-variation-settings: 'FILL' 1;">alarm_on</span>
<!-- Subtle highlight for the intensive option -->
<div class="absolute inset-0 bg-gradient-to-tr from-transparent via-white/20 to-transparent opacity-0 peer-checked:opacity-100"></div>
</div>
<div class="ml-4 flex-1 z-10">
<div class="text-title-lg font-title-lg text-on-surface mb-0.5 transition-colors peer-checked:text-primary">30 phút/ngày</div>
<div class="text-label-md font-label-md text-on-surface-variant">Cấp tốc</div>
</div>
<div class="w-6 h-6 rounded-full border-2 border-outline-variant flex items-center justify-center transition-all duration-300 z-10 peer-checked:border-primary peer-checked:bg-primary ml-2 shrink-0">
<span class="material-symbols-outlined text-[14px] text-on-primary scale-0 transition-transform duration-300 peer-checked:scale-100 font-bold">check</span>
</div>
</div>
</label>
</form>
</div>
</main>
<!-- Fixed Footer Action -->
<div class="fixed bottom-0 left-0 w-full bg-gradient-to-t from-surface via-surface/95 to-transparent pt-12 pb-6 px-margin-mobile z-40">
<div class="max-w-md mx-auto">
<button class="w-full py-4 rounded-xl bg-primary text-on-primary text-title-lg font-title-lg font-bold shadow-[0_8px_20px_rgba(53,37,205,0.25)] hover:bg-primary-container hover:-translate-y-0.5 active:translate-y-0 active:scale-[0.98] transition-all flex items-center justify-center gap-2" type="button">
<span>Tiếp tục</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</div>
</div>
</body></html>
